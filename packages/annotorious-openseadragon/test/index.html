<!DOCTYPE html>
<html>
  <head>
    <meta charset='utf-8' />
    <title>Annotorious 4 - OpenSeadragon / Deck.GL</title>
    <script type='module' src='./index.ts'></script>
    <style>
      html, body, #openseadragon {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      .controls {
        position: absolute;
        top: 10px;
        right: 10px;
        z-index: 2;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px 12px;
        border-radius: 4px;
        font: 13px sans-serif;
      }

      .controls label {
        margin-right: 6px;
      }

      #fps {
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div id="openseadragon">
      <div class="controls">
        <label for="count">Polygons</label>
        <input id="count" type="number" value="100000" min="0" step="1000" style="width: 90px" />
        <button id="regenerate">Regenerate</button>
        <span id="fps">-- fps</span>
      </div>
    </div>
  </body>
</html>
